<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diritto 8bit">
<meta name="theme-color" content="#1b1b3a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Diritto Pubblico 8-bit</title>
<style>
:root { --bg:#1b1b3a; --panel:#2a2a55; --ink:#fff; --muted:#b8b8e0; --yellow:#ffd23f; --green:#3ec46d; --red:#e84855; --blue:#3f88c5; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; background:var(--bg); color:var(--ink); }
body {
  font:15px/1.45 ui-monospace, Menlo, "Courier New", monospace;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select:none; user-select:none; overscroll-behavior:none;
}
#app { max-width:480px; margin:0 auto; padding:8px 12px 24px; }
#top { display:flex; align-items:center; gap:8px; font-weight:bold; padding:6px 2px; }
#top .xp { color:var(--yellow); font-size:18px; }
#top .liv { color:var(--muted); font-size:12px; flex:1; }
#top button { width:44px; height:44px; padding:0; font-size:20px; margin:0; }
#scena { display:block; width:100%; aspect-ratio:4/3; image-rendering:pixelated; background:#000;
         box-shadow:0 0 0 4px #000, 0 0 0 8px var(--yellow); margin:8px 0 18px; }
#app.compatta #scena { width:62%; margin:8px auto 16px; }
h2 { font-size:16px; text-transform:uppercase; letter-spacing:1px; color:var(--yellow); margin:16px 0 8px; }
button, select {
  font:inherit; font-weight:bold; color:var(--ink); background:var(--blue); border:0; border-radius:0;
  width:100%; min-height:54px; margin:6px 0; padding:10px 12px; cursor:pointer;
  box-shadow: inset -4px -4px 0 rgba(0,0,0,.35), 0 0 0 3px #000;
}
button:active { transform:translateY(2px); box-shadow: inset 4px 4px 0 rgba(0,0,0,.35), 0 0 0 3px #000; }
button.verde { background:var(--green); } button.rosso { background:var(--red); }
button.giallo { background:var(--yellow); color:#222; } button.grigio { background:#555; }
select { background:var(--panel); appearance:none; -webkit-appearance:none; }
.riga { display:flex; gap:10px; } .riga > * { flex:1; }
.card { background:#fff8e1; color:#222; padding:14px; margin:8px 0 12px; box-shadow:0 0 0 3px #000, 6px 6px 0 3px rgba(0,0,0,.5); }
.card .cap { font-size:11px; color:#666; text-transform:uppercase; }
.card .dom { font-size:17px; font-weight:bold; margin-top:4px; }
.risp { margin-top:12px; padding-top:12px; border-top:2px dashed #999; font-size:15px; }
.risp b { background:#ffe27a; }
.flip { min-height:180px; display:flex; flex-direction:column; justify-content:center; text-align:center; cursor:pointer; }
.flip .dom { font-size:20px; } .hint { font-size:12px; color:#888; margin-top:10px; }
.opz.giusta { background:var(--green); } .opz.sbagliata { background:var(--red); } .opz:disabled { opacity:1; }
.info { color:var(--muted); font-size:13px; text-align:center; margin:4px 0; }
.barra { height:14px; background:#111; box-shadow:0 0 0 2px #000; margin:4px 0 10px; }
.barra > div { height:100%; background:var(--green); }
.cap-riga { font-size:13px; }
.griglia { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.skin { background:var(--panel); padding:8px; text-align:center; font-size:12px; box-shadow:0 0 0 3px #000; }
.skin canvas { width:100%; image-rendering:pixelated; display:block; margin-bottom:6px; background:#000; }
.skin button { min-height:40px; font-size:12px; margin:6px 0 0; }
.skin.bloccata canvas { filter:brightness(.25); }
.voto { font-size:44px; text-align:center; color:var(--yellow); font-weight:bold; margin:8px 0; }
#modal { position:fixed; inset:0; background:rgba(0,0,0,.75); display:flex; align-items:center; justify-content:center; padding:24px; z-index:9; }
#modal[hidden] { display:none; }
#modal .box { background:var(--panel); padding:18px; max-width:360px; width:100%; text-align:center; box-shadow:0 0 0 4px #000, 0 0 0 8px var(--yellow); }
#modal .box h3 { color:var(--yellow); margin:0 0 8px; }
textarea { width:100%; height:90px; font:12px monospace; }
</style>
</head>
<body>
<div id="app">
  <div id="top"><span class="xp">⭐ <span id="xp">0</span></span><span class="liv" id="liv"></span><button id="snd" aria-label="Suono">🔊</button></div>
  <canvas id="scena" width="128" height="96" aria-label="Aula 8-bit con lo studente e il professore"></canvas>
  <main id="schermo"></main>
</div>
<div id="modal" hidden></div>
<script src="domande.js"></script>
<script src="app.js"></script>
</body>
</html>
