<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diritto 3D">
<meta name="theme-color" content="#1d1b2e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Città del Diritto</title>
<style>
:root { --ink:#1d1b2e; --carta:#fffaf0; --giallo:#ffcf33; --verde:#38c172; --rosso:#ef4f5f; --blu:#3d7bf2; --viola:#7a5cf0; --grigio:#8a8aa3; --muto:#6b6880; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; overflow:hidden; background:#8fd3ff; color:var(--ink);
  font:600 16px/1.42 ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif; -webkit-user-select:none; user-select:none; overscroll-behavior:none; -webkit-text-size-adjust:100%; }
#mondo { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
body.no3d { background:linear-gradient(#8fd3ff, #62c34e); }

/* HUD in alto */
#hud { position:fixed; top:calc(env(safe-area-inset-top) + 8px); left:calc(env(safe-area-inset-left) + 10px); right:calc(env(safe-area-inset-right) + 10px);
  display:flex; gap:8px; align-items:center; z-index:5; pointer-events:none; }
.pill { background:var(--carta); border:3px solid var(--ink); border-radius:999px; padding:3px 9px; font-weight:900; box-shadow:0 3px 0 var(--ink); white-space:nowrap; }
#liv { flex:1; min-width:0; font-size:11px; font-weight:800; color:#fff; text-shadow:0 1px 0 #000, 0 0 4px #000; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#b-menu, .hudbtn { pointer-events:auto; width:50px; height:50px; min-height:0; margin:0; padding:0; font-size:24px; border-radius:16px; flex:none; }

/* bottoni grossi stile cartone */
button, select { font:inherit; font-weight:900; color:#fff; background:var(--blu); border:3px solid var(--ink); border-radius:14px;
  width:100%; min-height:52px; margin:6px 0; padding:10px 12px; box-shadow:0 4px 0 var(--ink); cursor:pointer; touch-action:manipulation; }
button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
button:disabled { opacity:1; }
.giallo { background:var(--giallo); color:var(--ink); } .verde { background:var(--verde); } .rosso { background:var(--rosso); }
.grigio { background:var(--grigio); } .viola { background:var(--viola); }
select { background:#fff; color:var(--ink); appearance:none; -webkit-appearance:none; text-align:left; }

/* pulsante d'azione quando sei vicino a un prof */
#azione { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 22px); transform:translateX(-50%); width:min(88%, 380px); z-index:5;
  font-size:18px; min-height:62px; animation:salta 1.1s ease-in-out infinite; }
#azione:active { transform:translateX(-50%) translateY(3px); }
@keyframes salta { 0%,100% { margin-bottom:0 } 50% { margin-bottom:6px } }
#aiuto { position:fixed; left:calc(env(safe-area-inset-left) + 10px); right:calc(env(safe-area-inset-right) + 86px); top:calc(env(safe-area-inset-top) + 66px); max-width:420px; z-index:4; pointer-events:none;
  background:rgba(29,27,46,.82); color:#fff; border-radius:16px; padding:10px 14px; font-size:14px; text-align:center; }

/* joystick */
#joy { position:fixed; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; border:4px solid rgba(255,255,255,.85); background:rgba(29,27,46,.25); z-index:4; pointer-events:none; }
#joy > div { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%; background:#fff; border:3px solid var(--ink); }

/* barra del duello */
#duello { position:fixed; top:calc(env(safe-area-inset-top) + 66px); left:calc(env(safe-area-inset-left) + 10px); right:calc(env(safe-area-inset-right) + 10px); z-index:5;
  max-width:500px; margin:0 auto; background:var(--carta); border:3px solid var(--ink); border-radius:16px; box-shadow:0 4px 0 var(--ink); padding:8px 12px; font-size:14px; }
.drow { display:flex; align-items:center; gap:8px; } .drow + .drow { margin-top:4px; }
.drow b { flex:0 0 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:52%; }
.drow .fill { flex:1; }
.tacche { display:flex; gap:3px; justify-content:flex-end; } .tacche i { width:20px; height:14px; border:2px solid var(--ink); border-radius:4px; background:#e5e1d6; }
.tacche i.on { background:var(--verde); } .tacche.esame i { width:12px; } .tacche i.ko { background:var(--rosso); }
.cuori { letter-spacing:2px; font-size:16px; }

/* pannello che sale dal basso */
#foglio { position:fixed; left:0; right:0; bottom:0; z-index:6; max-width:560px; margin:0 auto; max-height:62%; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y;
  background:var(--carta); border:4px solid var(--ink); border-bottom:0; border-radius:24px 24px 0 0; padding:14px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -5px 0 rgba(0,0,0,.18); animation:su .22s ease-out; -webkit-user-select:text; user-select:text; }
#foglio.alto { max-height:calc(100% - env(safe-area-inset-top) - 70px); }
@keyframes su { from { transform:translateY(40px); opacity:.4 } }
#foglio h2 { margin:4px 0 10px; font-size:20px; font-weight:900; }
#foglio h3 { margin:16px 0 6px; font-size:14px; text-transform:uppercase; letter-spacing:.5px; color:var(--muto); }
.testa { display:flex; align-items:center; gap:10px; } .testa h2 { flex:1; margin:0; } .testa .x { width:48px; min-height:44px; padding:0; flex:none; margin:0; }
.chi { display:inline-block; background:var(--ink); color:#fff; border-radius:10px; padding:3px 10px; font-weight:900; }
.chi small { color:#c9c4ff; font-weight:700; }
.fumetto { background:#fff; border:3px solid var(--ink); border-radius:16px; padding:12px 14px; margin:8px 0; font-size:17px; }
.info { color:var(--muto); font-size:14px; margin:6px 0; }
.riga { display:flex; gap:10px; } .riga > * { flex:1; }
.griglia2 { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }

/* domande */
.card { background:#fff; border:3px solid var(--ink); border-radius:16px; padding:14px; margin:4px 0 10px; box-shadow:0 4px 0 var(--ink); }
.card .cap { font-size:11px; color:var(--muto); text-transform:uppercase; font-weight:800; }
.card .dom { font-size:18px; font-weight:900; margin-top:4px; }
.risp { margin-top:12px; padding-top:12px; border-top:3px dashed #ddd; font-size:16px; font-weight:600; }
.risp b { background:#ffe98a; border-radius:4px; padding:0 2px; }
.flip { min-height:170px; display:flex; flex-direction:column; justify-content:center; text-align:center; cursor:pointer; background:#fff7d6; }
.flip .dom { font-size:21px; } .hint { font-size:13px; color:var(--muto); margin-top:10px; }
.opz { text-align:left; background:#fff; color:var(--ink); font-weight:800; }
.opz.giusta { background:var(--verde); color:#fff; } .opz.sbagliata { background:var(--rosso); color:#fff; } .opz.spenta { background:#eee; color:#999; }
.barra-top { display:flex; align-items:center; gap:10px; margin-bottom:4px; } .barra-top button { flex:0 0 auto; width:auto; min-height:40px; padding:6px 12px; margin:0; font-size:14px; }
.barra-top .info { flex:1; text-align:right; margin:0; }

/* armadio, progressi */
.griglia { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.skin { background:#fff; border:3px solid var(--ink); border-radius:16px; padding:8px; text-align:center; font-size:13px; font-weight:800; box-shadow:0 4px 0 var(--ink); }
.skin .prev { height:120px; display:flex; align-items:center; justify-content:center; border-radius:10px; margin-bottom:6px; background:#e9f3ff; overflow:hidden; font-size:56px; }
.skin .prev img { height:100%; }
.skin button { min-height:40px; font-size:13px; margin:6px 0 0; }
.skin.bloccata .prev { filter:grayscale(1) brightness(.45); }
.barra { height:16px; background:#e5e1d6; border:2px solid var(--ink); border-radius:8px; margin:3px 0 10px; overflow:hidden; } .barra > div { height:100%; background:var(--verde); }
.cap-riga { font-size:14px; }
.medaglie { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; text-align:center; font-size:12px; }
.medaglie div { background:#fff; border:3px solid var(--ink); border-radius:14px; padding:6px 2px; }
.medaglie span { display:block; font-size:30px; } .medaglie .no span { filter:grayscale(1); opacity:.3; }
.voto { font-size:52px; text-align:center; font-weight:900; margin:4px 0; }
.big { font-size:72px; text-align:center; line-height:1.1; }
.vai { text-align:left; font-size:15px; } .vai small { display:block; font-weight:700; opacity:.85; font-size:12px; }

/* finestre (sblocchi) */
#modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:24px; z-index:9; }
#modal[hidden] { display:none; }
#modal .box { background:var(--carta); border:4px solid var(--ink); border-radius:22px; padding:18px; max-width:340px; width:100%; text-align:center; box-shadow:0 6px 0 var(--ink); animation:pop .3s cubic-bezier(.3,1.6,.6,1); }
@keyframes pop { from { transform:scale(.6); opacity:0 } }
#modal h3 { margin:0 0 8px; font-size:22px; }
#modal img { height:150px; display:block; margin:6px auto; }
#modal .swatch { height:90px; border-radius:14px; border:3px solid var(--ink); margin:8px 0; font-size:48px; display:flex; align-items:center; justify-content:center; }
#foglio.medio { max-height:72%; }

/* biblioteca */
.legenda { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
.legenda span { font-size:12px; font-weight:900; padding:4px 9px; border:2px solid var(--ink); border-radius:8px; }
.l0 { background:#d9d2c3; color:var(--ink); } .l1 { background:#e8504a; color:#fff; } .l2 { background:#f09a30; color:#fff; }
.l3 { background:#3d7bf2; color:#fff; } .l4 { background:linear-gradient(135deg, #ffe680, #ffcf33 60%, #fff3b0); color:var(--ink); }
.scaffale { background:#c98f5a; border:3px solid var(--ink); border-radius:14px; padding:8px 8px 16px; margin:10px 0; box-shadow:inset 0 -9px 0 #7a4a24, 0 4px 0 var(--ink); }
.scaffale .tit { display:flex; justify-content:space-between; gap:8px; color:#fff; font-weight:900; font-size:14px; margin:0 2px 8px; text-shadow:0 1px 0 #5a3418; }
.scaffale .tit small { font-weight:700; opacity:.9; } .scaffale .tit b { flex:none; background:var(--ink); border-radius:8px; padding:0 8px; }
.libri { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
button.libro { min-height:84px; margin:0; padding:8px 6px 6px 12px; font-size:12px; line-height:1.25; text-align:left; display:flex; flex-direction:column; justify-content:space-between;
  border-radius:5px 10px 10px 5px; border-left-width:9px; box-shadow:0 3px 0 var(--ink); }
button.libro i { font-style:normal; font-size:11px; letter-spacing:1px; margin-top:6px; }
button.libro.l4 { box-shadow:0 3px 0 var(--ink), 0 0 12px #ffd23f; }
.pallini { padding:1px 6px; border-radius:6px; border:2px solid var(--ink); letter-spacing:1px; }
.testo { font-size:16px; font-weight:500; line-height:1.55; -webkit-user-select:text; user-select:text; }
.testo strong { font-weight:800; } .testo h4 { margin:14px 0 4px; font-size:15px; }
.testo blockquote { margin:10px 0; padding:8px 12px; background:#fff3c4; border:3px solid var(--ink); border-radius:12px; }
.testo blockquote p { margin:0; }
.testo table { display:block; overflow-x:auto; border-collapse:collapse; font-size:13px; margin:8px 0; }
.testo th, .testo td { border:2px solid #ccc; padding:4px 6px; vertical-align:top; text-align:left; } .testo th { background:#f1ebdd; }
.testo ul, .testo ol { padding-left:22px; } .testo li { margin:3px 0; }

/* speed round e incontri */
.timer { height:14px; border:3px solid var(--ink); border-radius:8px; background:#e5e1d6; overflow:hidden; margin:6px 0 8px; }
#tbar { height:100%; width:100%; background:linear-gradient(90deg, var(--rosso), var(--giallo) 40%, var(--verde)); }
.posta { background:#fff3c4; font-size:15px; }
.premio { display:flex; align-items:center; justify-content:center; gap:10px; background:#e9f3ff; border:3px solid var(--ink); border-radius:16px; margin:8px 0; }
.premio img { height:130px; } .premio span { font-weight:900; }
.skin.raro .prev { background:linear-gradient(135deg, #f3e6ff, #e9f3ff); }
/* lotta stile Pokémon */
.pk { display:flex; align-items:center; gap:8px; } .pk + .pk { margin-top:6px; }
.pk .nome { flex:0 1 auto; min-width:0; max-width:46%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; line-height:1.15; }
.pk .nome small { display:block; font-size:11px; color:var(--muto); font-weight:800; overflow:hidden; text-overflow:ellipsis; }
.hp { flex:1; height:14px; border:2px solid var(--ink); border-radius:8px; background:#e5e1d6; overflow:hidden; }
.hp i { display:block; height:100%; background:var(--verde); } .hp i.med { background:var(--giallo); } .hp i.low { background:var(--rosso); }
.pk .num { font-size:12px; font-weight:900; white-space:nowrap; } .fill { flex:1; }
#duello .msg { margin-top:6px; text-align:center; font-weight:900; color:var(--viola); }
.punto { text-align:left; background:#fff; color:var(--ink); font-weight:700; min-height:44px; padding:8px 12px; font-size:15px; } .punto.on { background:#d9f7e4; }
.opz.scelta { background:var(--blu); color:#fff; }
.card.evo { padding:8px 12px; font-size:13px; } .card.evo.no { opacity:.45; } .card.evo small { color:var(--muto); }
/* minimappa */
#mappa { position:fixed; top:calc(env(safe-area-inset-top) + 66px); right:calc(env(safe-area-inset-right) + 10px); width:66px; height:184px; z-index:5;
  border:3px solid var(--ink); border-radius:12px; box-shadow:0 3px 0 var(--ink); background:#62c34e; touch-action:manipulation; cursor:pointer; }
#mappa.grande { height:min(74vh, 640px); width:calc(min(74vh, 640px) * 43 / 120); top:50%; right:50%; transform:translate(50%, -50%); z-index:8; border-width:4px; box-shadow:0 6px 0 var(--ink), 0 0 0 100vmax rgba(0,0,0,.35); }
#toast { position:fixed; left:calc(env(safe-area-inset-left) + 10px); right:calc(env(safe-area-inset-right) + 86px); top:calc(env(safe-area-inset-top) + 66px); max-width:420px; z-index:4; pointer-events:none;
  background:rgba(29,27,46,.88); color:#fff; border-radius:16px; padding:10px 14px; font-size:14px; text-align:center; animation:pop .3s; }
label.voce { display:block; margin:10px 0; } label.voce b { display:block; font-size:14px; margin-bottom:4px; }
label.voce input, label.voce select { font:inherit; font-size:16px; width:100%; padding:10px 12px; border:3px solid var(--ink); border-radius:12px; background:#fff; color:var(--ink); min-height:48px; }
.griglia3 { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.scelta-amico { background:#e9f3ff; color:var(--ink); min-height:110px; padding:4px; font-size:40px; } .scelta-amico img { height:100px; display:block; margin:0 auto; }
.scelta-amico.on { background:var(--giallo); box-shadow:0 4px 0 var(--ink), 0 0 0 3px #fff inset; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<canvas id="mondo"></canvas>
<div id="hud">
  <span class="pill">⭐ <span id="xp">0</span></span>
  <span class="pill">🏅 <span id="med">0</span>/8</span>
  <span class="pill">🪙 <span id="monete">0</span></span>
  <span id="liv"></span>
  <button id="b-amico" class="viola hudbtn" aria-label="Parla con il compagno di studio">💬</button>
  <button id="b-menu" class="giallo" aria-label="Menu">☰</button>
</div>
<div id="duello" hidden></div>
<div id="aiuto" hidden>👆 Trascina per camminare · tocca un posto per andarci<br>🤏 Due dita: zoom e vista · 🗺 mappa · 💬 il tuo compagno</div>
<div id="toast" hidden></div>
<canvas id="mappa" hidden aria-label="Mappa della città"></canvas>
<button id="azione" class="giallo" hidden></button>
<div id="joy" hidden><div></div></div>
<div id="foglio" hidden></div>
<div id="modal" hidden></div>
<script src="domande.js"></script>
<script src="argomenti.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
